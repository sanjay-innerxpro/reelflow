# /etc/nginx/sites-available/reelflow  (then: ln -s ../sites-available/reelflow /etc/nginx/sites-enabled/)
# HTTPS certificates: sudo certbot --nginx -d reels.example.com
server {
    listen 80;
    server_name reels.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name reels.example.com;
    root /var/www/reelflow/current/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/reels.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reels.example.com/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Sync-agent chunks are UPLOAD_CHUNK_SIZE_MB (default 8 MB) plus overhead.
    client_max_body_size 20M;
    client_body_timeout 300s;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
