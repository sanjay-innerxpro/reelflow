; /etc/supervisor/conf.d/reelflow-horizon.conf
; sudo supervisorctl reread && sudo supervisorctl update
[program:reelflow-horizon]
process_name=%(program_name)s
command=php /var/www/reelflow/current/artisan horizon
directory=/var/www/reelflow/current
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
; Allow running uploads (up to 1 hour) to finish on deploy/restart.
stopwaitsecs=3700
redirect_stderr=true
stdout_logfile=/var/www/reelflow/shared/storage/logs/horizon.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
