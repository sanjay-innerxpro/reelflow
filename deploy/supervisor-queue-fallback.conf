; Fallback when Horizon cannot be used (Redis still required for the
; "redis"/"redis-long" connections; for a database queue set
; QUEUE_CONNECTION=database and QUEUE_LONG_CONNECTION=database and use the
; commands below with "database" as the connection name).
[program:reelflow-worker-general]
command=php /var/www/reelflow/current/artisan queue:work redis --queue=notifications,default,media,ai --timeout=900 --tries=3 --max-jobs=500 --sleep=3
user=www-data
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=960
redirect_stderr=true
stdout_logfile=/var/www/reelflow/shared/storage/logs/worker-general.log

[program:reelflow-worker-publishing]
command=php /var/www/reelflow/current/artisan queue:work redis-long --queue=ingest,publish-youtube,publish-instagram,publish-facebook --timeout=3600 --tries=1 --max-jobs=200 --sleep=3
user=www-data
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=3700
redirect_stderr=true
stdout_logfile=/var/www/reelflow/shared/storage/logs/worker-publishing.log
